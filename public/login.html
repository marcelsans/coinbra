<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtus Consultoria | Login</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Segoe UI',Arial,sans-serif;
    background:#343a4a;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    background:#fff;border-radius:14px;padding:40px 36px;
    width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .logo{width:100%;text-align:center;margin-bottom:24px;}
  .logo img{max-width:200px;width:100%;height:auto;display:inline-block;}
  h1{font-size:19px;font-weight:700;color:#0f172a;text-align:center;margin:0 0 6px;}
  p.sub{font-size:13.5px;color:#64748b;text-align:center;margin:0 0 28px;}
  label{font-size:13px;font-weight:600;color:#0f172a;display:block;margin-bottom:6px;}
  input{
    width:100%;padding:11px 14px;border:1px solid #dfe3ee;border-radius:8px;
    font-size:14px;margin-bottom:18px;font-family:inherit;
  }
  input:focus{outline:none;border-color:#343a4a;}
  button{
    width:100%;padding:12px;border:none;border-radius:8px;
    background:#343a4a;color:#fff;font-size:14.5px;font-weight:700;
    cursor:pointer;margin-top:6px;
  }
  button:hover{background:#4b5266;}
  .erro{
    background:#fdedec;color:#e6483a;font-size:13px;padding:10px 12px;
    border-radius:7px;margin-bottom:16px;display:none;
  }
  .erro.mostrar{display:block;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo"><img src="img/logo-login.png" alt="Virtus Consultoria"></div>
    <h1>Acesse sua conta</h1>
    <p class="sub">Relatório de Inadimplência — Virtus Consultoria</p>

    <div class="erro" id="msgErro">E-mail ou senha incorretos.</div>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    const CREDENCIAIS = {
      email: 'construtoracoinbra@gmail.com',
      senha: 'coinbra'
    };

    document.getElementById('formLogin').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      const msgErro = document.getElementById('msgErro');

      if (email === CREDENCIAIS.email && senha === CREDENCIAIS.senha) {
        sessionStorage.setItem('virtus_logado', 'true');
        window.location.href = 'index.html';
      } else {
        msgErro.classList.add('mostrar');
      }
    });
  </script>
</body>
</html>
